aid: arzana
name: Arzana
description: >-
  Arzana is an AI-powered Office Execution System for US manufacturers and
  distributors, founded in 2025 in San Francisco and backed by Y Combinator
  (Spring 2026). Arzana trains custom models on a factory's historical data and
  deploys agents that automate back-office work — quoting, estimating, order
  entry, purchasing, prospecting, outreach, CRM, AP 3-way match, AR tracking,
  and customer service — alongside a customizable ERP/CRM/MES with every agent
  pre-installed. Forward-deployed engineers configure each agent per operation;
  Arzana reports going live in 120 days with 99%+ accuracy. Arzana currently
  exposes no public developer API, SDK, or documentation surface; it does
  publish a /llms.txt for agent discovery.
